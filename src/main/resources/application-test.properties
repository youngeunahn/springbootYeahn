# Test Database Configuration for GitHub Actions
spring.datasource.driverClassName=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:mariadb://localhost:3306/yeahn_test?characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# MyBatis
# mybatis.config=mybatis-config.xml
mybatis.type-aliases-package=com.yeahn.model
mybatis.mapper-locations=query/mapper/**/*.xml

# Mocking external services for tests
resource.handler=/api/image/imageUpload/**
resource.location=file:///tmp/imgUpload/
image.upload.path=/tmp/imgUpload/
spring.servlet.multipart.location=/tmp/imgUpload/
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Dummy values for COS (to prevent context load failure)
cos.endpoint=https://dummy-endpoint
cos.location=dummy
cos.api-key=dummy
cos.service-instance-id=dummy
cos.iam_serviceid_crn=dummy
cos.bucket=dummy-bucket

spring.environment=local
spring.main.allow-bean-definition-overriding=true
logging.level.root=info
