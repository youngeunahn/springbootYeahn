# JDBC Connection (Environment Variables)
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:net.sf.log4jdbc.sql.jdbcapi.DriverSpy}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

logging.level.root=info
logging.config=classpath:logback.xml

# MyBatis
mybatis.config=mybatis-config.xml
mybatis.type-aliases-package=com.yeahn.model
mybatis.mapper-locations=query/mapper/**/*.xml

# Mustache View Resolver
spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.mustache
spring.mustache.cache=false

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Resource & File Upload
resource.handler=/api/image/imageUpload/**
resource.location=${RESOURCE_LOCATION:file:/app/imgUpload/}
image.upload.path=${IMAGE_UPLOAD_PATH:/app/imgUpload/}

# IBM Cloud Object Storage (Environment Variables)
cos.endpoint=${COS_ENDPOINT}
cos.location=${COS_LOCATION}
cos.api-key=${COS_API_KEY}
cos.service-instance-id=${COS_SERVICE_INSTANCE_ID}
cos.iam_serviceid_crn=${COS_IAM_SERVICEID_CRN}
cos.bucket=${COS_BUCKET}

spring.environment=${SPRING_ENVIRONMENT:prod}

# Tomcat Thread config
spring.datasource.tomcat.max-active=30
spring.datasource.tomcat.max-idle=30
spring.datasource.tomcat.min-idle=0
spring.datasource.tomcat.max-wait=10000
spring.datasource.tomcat.test-on-borrow=false
spring.datasource.tomcat.test-on-return=false
spring.datasource.tomcat.test-while-idle=true
spring.datasource.tomcat.num-tests-per-eviction-run=10
spring.datasource.tomcat.time-between-eviction-runs-millis=600000
spring.datasource.tomcat.validation-query=SELECT 1

# Common Spring Config
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true
server.servlet.context-path=/
server.tomcat.uri-encoding=UTF-8
spring.jmx.enabled=false

server.error.include-stacktrace=always
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false
spring.freemarker.cache=false

# Multipart config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${SPRING_SERVLET_MULTIPART_LOCATION:/app/imgUpload/}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.user-web.allowed-origins=https://web-yeahn-fitbase-dpuqy925lbpzzblu.gksl2.cloudtype.app

# OpenAPI
springdoc.paths-to-match=/api/user/**
springdoc.paths-to-exclude=/api/user/check-id,/api/user/signUp,/api/user/login

# JWT
app.jwt.secret=${JWT_SECRET:change-this-development-jwt-secret-at-least-32-bytes}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Log outbox worker
app.log-outbox.poll-interval-ms=${LOG_OUTBOX_POLL_INTERVAL_MS:1000}
app.log-outbox.batch-size=${LOG_OUTBOX_BATCH_SIZE:100}
app.log-outbox.max-retry-count=${LOG_OUTBOX_MAX_RETRY_COUNT:5}
app.log-outbox.retention-days=${LOG_OUTBOX_RETENTION_DAYS:7}

# HTTP/2 Protocol Error Fix: Increase max header size
server.max-http-header-size=32768
