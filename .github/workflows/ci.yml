name: Java CI/CD with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yeahn_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Set up MariaDB Schema and Function
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot yeahn_test < src/main/resources/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot yeahn_test -e "
          DROP FUNCTION IF EXISTS FN_GET_COMM_CODE_DESC;
          DELIMITER //
          CREATE FUNCTION FN_GET_COMM_CODE_DESC(V_IN_TYPE_CLASS VARCHAR(100), V_IN_TYPE_CODE VARCHAR(100))
          RETURNS VARCHAR(500) CHARSET utf8mb4 COLLATE utf8mb4_general_ci
          DETERMINISTIC READS SQL DATA
          BEGIN
              DECLARE V_OUT_DESC VARCHAR(500);
              SELECT CD.CODE_DESC INTO V_OUT_DESC
              FROM TB_COMM_CLASS CLS
              JOIN TB_COMM_CODE CD ON CLS.TYPE_CLASS = CD.TYPE_CLASS
              WHERE CLS.TYPE_CLASS = V_IN_TYPE_CLASS AND CD.TYPE_CODE = V_IN_TYPE_CODE
              AND CLS.USE_YN = 'Y' AND CD.USE_YN = 'Y' LIMIT 1;
              RETURN V_OUT_DESC;
          END //
          DELIMITER ;"

      - name: Build with Maven
        run: mvn -B package --file pom.xml -Dspring.profiles.active=test -DskipTests

      - name: Run Tests
        run: mvn test -Dspring.profiles.active=test -e -X

  deploy:
    name: Deploy to Cloudtype
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Cloudtype
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          ghtoken: ${{ secrets.GHP_TOKEN }}

      - name: Pre-download Scouter Agent
        run: |
          mkdir -p agent/scouter
          curl -L https://github.com/scouter-project/scouter/releases/download/v2.20.0/scouter-all-2.20.0.tar.gz | tar -xz -C agent/scouter --strip-components=3 scouter/agent.java

      - name: Deploy to Cloudtype
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: "yeahn1107/yeahn"
          stage: main
          yaml: |
            name: springbootyeahn
            app: java@8
            options:
              jdk: "8"
              ports: 8080
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: prod
                - name: SPRING_DATASOURCE_URL
                  value: "${{ secrets.SPRING_DATASOURCE_URL }}"
                - name: SPRING_DATASOURCE_USERNAME
                  value: "${{ secrets.SPRING_DATASOURCE_USERNAME }}"
                - name: SPRING_DATASOURCE_PASSWORD
                  value: "${{ secrets.SPRING_DATASOURCE_PASSWORD }}"
                - name: COS_API_KEY
                  value: "${{ secrets.COS_API_KEY }}"
                - name: COS_LOCATION
                  value: "${{ secrets.COS_LOCATION }}"
                - name: COS_SERVICE_INSTANCE_ID
                  value: "${{ secrets.COS_SERVICE_INSTANCE_ID }}"
                - name: COS_ENDPOINT
                  value: "${{ secrets.COS_ENDPOINT }}"
                - name: COS_BUCKET
                  value: "${{ secrets.COS_BUCKET }}"
                - name: COS_IAM_SERVICEID_CRN
                  value: "${{ secrets.COS_IAM_SERVICEID_CRN }}"
                - name: SCOUTER_COLLECTOR_IP
                  value: "${{ secrets.SCOUTER_COLLECTOR_IP }}"
            run:
              command: sh start.sh
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: master
              path: .
            build:
              command: |
                mkdir -p agent/scouter && \
                curl -L https://github.com/scouter-project/scouter/releases/download/v2.20.0/scouter-all-2.20.0.tar.gz | tar -xz -C agent/scouter --strip-components=3 scouter/agent.java && \
                mvn -B package -DskipTests
