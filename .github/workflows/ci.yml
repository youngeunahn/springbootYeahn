name: Java CI/CD with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # 수동으로 전체 워크플로우를 실행하고 싶을 때 사용

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yeahn_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Set up MariaDB Schema and Function
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot yeahn_test < src/main/resources/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot yeahn_test -e "
          DROP FUNCTION IF EXISTS FN_GET_COMM_CODE_DESC;
          DELIMITER //
          CREATE FUNCTION FN_GET_COMM_CODE_DESC(V_IN_TYPE_CLASS VARCHAR(100), V_IN_TYPE_CODE VARCHAR(100))
          RETURNS VARCHAR(500) CHARSET utf8mb4 COLLATE utf8mb4_general_ci
          DETERMINISTIC READS SQL DATA
          BEGIN
              DECLARE V_OUT_DESC VARCHAR(500);
              SELECT CD.CODE_DESC INTO V_OUT_DESC
              FROM TB_COMM_CLASS CLS
              JOIN TB_COMM_CODE CD ON CLS.TYPE_CLASS = CD.TYPE_CLASS
              WHERE CLS.TYPE_CLASS = V_IN_TYPE_CLASS AND CD.TYPE_CODE = V_IN_TYPE_CODE
              AND CLS.USE_YN = 'Y' AND CD.USE_YN = 'Y' LIMIT 1;
              RETURN V_OUT_DESC;
          END //
          DELIMITER ;"

      - name: Build with Maven
        run: mvn -B package --file pom.xml -Dspring.profiles.active=test -DskipTests

      - name: Run Tests
        run: mvn test -Dspring.profiles.active=test -e -X

  deploy:
    name: Deploy to Cloudtype
    needs: build # 빌드가 성공해야만 배포 단계로 넘어감
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production # 이 설정이 '수동 승인' 버튼을 활성화함

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Cloudtype
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          ghtoken: ${{ secrets.GHP_TOKEN }}

      - name: Deploy to Cloudtype
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: "yeahn1107/yeahn"
          stage: main
          yaml: |
            name: springbootyeahn
            app: java@8
            options:
              jdk: "8"
            env:
              - SPRING_PROFILES_ACTIVE=prod
              - SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
              - SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
              - SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
              - COS_API_KEY=${{ secrets.COS_API_KEY }}
              - COS_LOCATION=${{ secrets.COS_LOCATION }}
              - COS_SERVICE_INSTANCE_ID=${{ secrets.COS_SERVICE_INSTANCE_ID }}
              - COS_ENDPOINT=${{ secrets.COS_ENDPOINT }}
              - COS_BUCKET=${{ secrets.COS_BUCKET }}
              - COS_IAM_SERVICEID_CRN=${{ secrets.COS_IAM_SERVICEID_CRN }}
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: master
              path: .
            build:
              command: mvn -B package -DskipTests
