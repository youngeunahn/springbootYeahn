name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:10.6
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yeahn_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Wait for MariaDB and Init Schema
      env:
        MYSQL_PWD: root
      run: |
        # MariaDB가 완전히 준비될 때까지 대기 (Health check가 있지만 더 확실하게 보장)
        until mysqladmin ping -h 127.0.0.1 --silent; do
          echo 'waiting for mariadb...'
          sleep 1
        done
        
        # 스키마 및 함수 초기화
        mysql -h 127.0.0.1 -u root yeahn_test < src/main/resources/schema.sql
        mysql -h 127.0.0.1 -u root yeahn_test -e "
        DROP FUNCTION IF EXISTS FN_GET_COMM_CODE_DESC;
        DELIMITER //
        CREATE FUNCTION FN_GET_COMM_CODE_DESC(V_IN_TYPE_CLASS VARCHAR(100), V_IN_TYPE_CODE VARCHAR(100))
        RETURNS VARCHAR(500) CHARSET utf8mb4 COLLATE utf8mb4_general_ci
        DETERMINISTIC READS SQL DATA
        BEGIN
            DECLARE V_OUT_DESC VARCHAR(500);
            SELECT CD.CODE_DESC INTO V_OUT_DESC
            FROM TB_COMM_CLASS CLS
            JOIN TB_COMM_CODE CD ON CLS.TYPE_CLASS = CD.TYPE_CLASS
            WHERE CLS.TYPE_CLASS = V_IN_TYPE_CLASS AND CD.TYPE_CODE = V_IN_TYPE_CODE
            AND CLS.USE_YN = 'Y' AND CD.USE_YN = 'Y' LIMIT 1;
            RETURN V_OUT_DESC;
        END //
        DELIMITER ;"

    - name: Build and Test with Maven
      # 환경 변수(S3 등)가 필요한 경우 여기에 추가 정의 가능
      # env:
      #   S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      #   S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      #   S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      run: mvn -B package -Dspring.profiles.active=test -e

    - name: Upload Build Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-app
        path: target/*.jar
